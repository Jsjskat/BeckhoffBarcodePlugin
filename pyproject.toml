#This file is used to package the BeckhoffBarcodePlugin plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.1
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beckhoffbarcodeplugin"
description = "Provides support for scanning Beckhoff barcodes"
dynamic = ["version"]
authors = [
    { name = "Antoine Trotte" }
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    # Enter your plugin library dependencies here
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.entry-points."inventree_plugins"]
BeckhoffBarcodePlugin = "beckhoffbarcodeplugin.core:BeckhoffBarcodePlugin"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = {attr = "beckhoffbarcodeplugin.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["beckhoffbarcodeplugin"]

[tool.ruff.lint]

ignore = [
    "I001",
    "PIE790",
    "RUF012"
]
